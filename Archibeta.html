<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChillEngine - архитектура v.a-0.1 </title>
<style>
:root{
  --bg:#14161a; --panel:#1c1f24; --panel-b:#333844; --text:#e7e9ee; --muted:#93a0b3;
  --accent:#4fc3f7; --hook:#ff3b9a; --req:#ffd54f;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
#page{display:flex;height:100vh;}
#diagram-scroll{flex:1;overflow:auto;position:relative;padding:26px 30px;}
#title-bar{margin-bottom:18px;}
#title-bar h1{font-size:19px;margin:0 0 4px;}
#title-bar .sub{color:var(--muted);font-size:12.5px;line-height:1.6;max-width:900px;}
#rule{display:inline-block;margin-top:8px;font-size:12px;color:var(--req);background:#2a2410;border:1px solid #4a3f1a;border-radius:6px;padding:6px 10px;}

#grid{position:relative;display:flex;gap:56px;min-width:1500px;padding-top:6px;}
.col{display:flex;flex-direction:column;align-items:stretch;width:168px;flex-shrink:0;}
.col-head{font-size:13px;font-weight:800;text-align:center;padding:6px 0 10px;border-bottom:3px solid;margin-bottom:14px;}
.col-note{font-size:10.5px;color:var(--muted);line-height:1.45;text-align:center;margin-bottom:14px;min-height:52px;}
.col-body{display:flex;flex-direction:column;gap:12px;justify-content:center;flex:1;}

.card{position:relative;background:#1f232a;border:1.5px solid #333844;border-radius:9px;padding:9px 11px;cursor:pointer;transition:border-color .15s, transform .1s;}
.card:hover{border-color:var(--accent);transform:translateY(-1px);}
.card .name{font-size:12.5px;font-weight:700;color:#fff;}
.card .off{opacity:.32;}
.card.off{background:#181a1e;}
.card .badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.badge{font-size:9px;padding:1px 6px;border-radius:8px;background:#262a31;color:var(--muted);}
.badge.req{background:#3a3210;color:var(--req);}
.badge.dd{background:#3a3210;color:var(--req);border:1px solid #4a3f1a;}
.badge.hook{background:#3a1030;color:var(--hook);cursor:help;}
.card input[type=checkbox]{position:absolute;top:8px;right:8px;accent-color:var(--accent);cursor:pointer;}
.card.core3{border-color:#1c4966;}
.choice-row{display:flex;gap:5px;margin-top:6px;}
.choice-btn{flex:1;font-size:9.5px;padding:3px 4px;border-radius:5px;border:1px solid #333844;background:#141619;color:var(--muted);cursor:pointer;text-align:center;}
.choice-btn.sel{background:#1c4966;color:#8fd6ff;border-color:#2a6a92;}

svg#edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
.edge-dim{stroke:#3a3f47;stroke-width:1px;fill:none;opacity:.55;}
.edge-bold{stroke:#5b8fb0;stroke-width:1.6px;fill:none;marker-end:url(#arrow);opacity:.9;}
.edge-off{opacity:.12 !important;}

#sidebar{width:340px;flex-shrink:0;background:#181b20;border-left:1px solid var(--panel-b);padding:20px 18px;overflow-y:auto;}
#sidebar h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 12px;}
.presets{display:flex;gap:8px;margin-bottom:16px;}
.btn{background:#262a31;border:1px solid var(--panel-b);color:var(--text);border-radius:7px;padding:8px 10px;font-size:12px;cursor:pointer;flex:1;font-weight:600;}
.btn:hover{background:#31363f;}
.btn.game{border-color:#2a6a92;background:#173c52;}
.btn.editor{border-color:#7a2050;background:#3a1030;}

.summary{background:#1f232a;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;}
.summary .row{display:flex;justify-content:space-between;margin-bottom:5px;}
.summary .row .v{font-weight:700;}
.summary .bylayer{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.7;}

#log{font-size:11.5px;color:var(--muted);background:#1f232a;border-radius:8px;padding:10px 12px;max-height:130px;overflow-y:auto;line-height:1.6;margin-bottom:16px;}
#log div{margin-bottom:3px;}
#log .cascade{color:var(--hook);}

.legend-item{display:flex;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.legend-swatch{width:22px;height:0;border-top:2px solid;margin-right:8px;}
.legend-swatch.dim{border-top:1px solid #3a3f47;}
.legend-swatch.bold{border-top:2px solid #5b8fb0;}
.legend-swatch.hook{border-top:2px dashed var(--hook);}

#tooltip{position:fixed;pointer-events:none;background:#0d0f12;border:1px solid #3a3f47;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;max-width:320px;z-index:100;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.5);}
#tooltip .tt-title{font-weight:700;margin-bottom:3px;}
#tooltip .tt-role{color:#d6dae1;margin-bottom:5px;}
#tooltip .tt-stats{color:var(--muted);font-size:11px;}
#tooltip .tt-hint{color:var(--accent);font-size:10.5px;margin-top:5px;}

#dd-overlay{position:fixed;inset:0;background:rgba(6,7,9,.72);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
#dd-overlay.open{display:flex;}
#dd-modal{background:#181b20;border:1px solid #333844;border-radius:12px;max-width:820px;width:100%;padding:26px 30px 30px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
#dd-close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px;}
#dd-close:hover{background:#262a31;color:#fff;}
#dd-title{font-size:22px;font-weight:700;margin:0 0 4px;}
#dd-badges{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.dd-badge{font-size:11px;padding:3px 9px;border-radius:12px;background:#262a31;color:var(--muted);border:1px solid #333844;}
#dd-intro{font-size:14.5px;line-height:1.6;color:#dfe3e9;background:#1f232a;border-left:3px solid var(--accent);padding:12px 14px;border-radius:6px;margin-bottom:20px;}
.dd-section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:22px 0 10px;font-weight:700;}
.dd-api-item{background:#1f232a;border:1px solid #2b303a;border-radius:8px;padding:10px 13px;margin-bottom:8px;}
.dd-api-sig{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12.5px;color:#8fd6ff;margin-bottom:4px;word-break:break-word;}
.dd-api-desc{font-size:13px;color:#c7cdd6;line-height:1.5;}
.dd-p{font-size:14px;line-height:1.7;color:#d6dae1;margin:0 0 14px;}
.dd-h{font-size:15px;font-weight:700;color:#fff;margin:18px 0 8px;}
.dd-code{background:#0d0f12;border:1px solid #2b303a;border-radius:8px;padding:13px 15px;font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;color:#c9d1d9;overflow-x:auto;white-space:pre;margin:0 0 14px;}
#dd-connects{font-size:13.5px;line-height:1.6;color:#c7cdd6;background:#1f232a;border-radius:8px;padding:12px 14px;}
.dd-study-list{font-size:13px;color:#c7cdd6;line-height:1.9;padding-left:18px;margin:0;}
.dd-generic-note{font-size:13px;color:var(--muted);line-height:1.7;background:#1f232a;border:1px dashed #3a3f47;border-radius:8px;padding:14px 16px;margin-top:16px;}
</style>
</head>
<body>
<div id="tooltip"></div>
<div id="page">
  <div id="diagram-scroll">
    <div id="title-bar">
      <button class="btn" style="margin-bottom: 12px; display: inline-block; flex: none;" onclick="window.location.href='index.html'">НАЗАД</button>
      <h1>Целевая архитектура — минимальный набор (21 модуль из 436)</h1>
      
      
    </div>
    <div id="grid"></div>
  </div>

  <div id="sidebar">
    <h2>Менеджер модулей</h2>
    <div class="presets">
      <button class="btn game" id="preset-game">🎮 Игрок (Shipping)</button>
      <button class="btn editor" id="preset-editor">🛠 Редактор</button>
    </div>
    <div class="summary" id="summary"></div>
    <div id="log"></div>

    <h2>Обозначения</h2>
    <div class="legend-item"><div class="legend-swatch dim"></div>тонкая линия — зависимость от Core (есть у всех)</div>
    <div class="legend-item"><div class="legend-swatch bold"></div>обычная — реальная связь между модулями</div>
    
    <div class="legend-item"><span class="badge req" style="margin-right:8px;">обяз.</span>нельзя выключить</div>
    
  </div>
</div>

<div id="dd-overlay">
  <div id="dd-modal">
    <button id="dd-close">×</button>
    <div id="dd-title"></div>
    <div id="dd-badges"></div>
    <div id="dd-body"></div>
  </div>
</div>

<script>
const DEEPDIVE = {"Core": {"intro": "Core — это не «один алгоритм», а набор строительных блоков, на которых держится вообще всё остальное. Разобранным считается, если у тебя есть свой контейнер, своя система умных указателей и свой планировщик задач, и другой твой код реально ими пользуется вместо std:: и голых new/delete.", "api": [{"sig": "template<T> class TArray", "desc": "Динамический массив: growable-буфер + Num()/Max(). Реализуй Add()/RemoveAt()/Reserve() так, чтобы при нехватке места буфер рос x1.5-x2, а не на 1 элемент."}, {"sig": "template<T> class TSharedPtr / TWeakPtr", "desc": "Умный указатель со счётчиком ссылок (refcount) в отдельном control-block. TWeakPtr не увеличивает refcount, а только проверяет, жив ли объект — нужен, чтобы избежать циклических ссылок."}, {"sig": "class FMemory", "desc": "Обёртка над malloc/free (или собственным пул-аллокатором) — единая точка, через которую всё остальное просит память."}, {"sig": "class FTaskGraph / void Dispatch(TFunction<void()> Task, TArray<FTaskHandle> Prerequisites)", "desc": "Пул потоков + граф зависимостей задач: задача стартует только когда выполнены все Prerequisites."}], "blocks": [{"type": "h", "text": "Зачем свой TArray, а не std::vector"}, {"type": "p", "text": "Дело не в «лучше», а в контроле: ты явно решаешь, как растёт буфер, как считать выравнивание, как логировать нехватку памяти. Это тот же паттерн, что и std::vector — непрерывный буфер + Num/Capacity — но твой."}, {"type": "h", "text": "TSharedPtr — как считать ссылки самому"}, {"type": "code", "text": "struct FRefCountBlock { int32 Strong=1; int32 Weak=0; T* Ptr; };\n\nTSharedPtr(T* raw) { Block = new FRefCountBlock{1,0,raw}; }\nTSharedPtr(const TSharedPtr& o) { Block=o.Block; Block->Strong++; }\n~TSharedPtr() { if(--Block->Strong==0){ delete Block->Ptr; if(Block->Weak==0) delete Block; } }"}, {"type": "p", "text": "Ключевая логика: объект удаляется, когда Strong==0. Сам control-block (счётчики) удаляется чуть позже — когда ещё и Weak==0, потому что TWeakPtr должен успеть проверить, жив ли ещё объект, даже после его удаления."}, {"type": "h", "text": "Task Graph — свой мини-планировщик"}, {"type": "p", "text": "Идея: задача — это узел графа. У узла есть список Prerequisites (какие узлы должны закончиться раньше). Планировщик держит очередь готовых к выполнению задач (у которых все Prerequisites выполнены) и N рабочих потоков; каждый берёт задачу из очереди, выполняет, а по завершении уменьшает счётчик незавершённых Prerequisites у всех, кто на неё ссылался; если счётчик дошёл до нуля — кладёт эту задачу в очередь готовых."}], "connects": "Все остальные модули (CoreUObject, Engine, RHI…) подключают Core как фундамент и используют именно твои TArray/TSharedPtr/Dispatch вместо std:: — поэтому этот модуль надо писать первым.", "study": ["динамические массивы и amortized O(1) push_back", "reference counting и слабые указатели", "work-stealing / task graph планировщики"]}, "CoreUObject": {"intro": "Здесь два независимых, но связанных навыка: рефлексия (программа знает о своих же классах и полях в рантайме) и сборка мусора (mark-and-sweep). Разобранным считается модуль, если твой класс, помеченный как «отражаемый», может быть автоматически сериализован в файл/JSON и автоматически не удалится, пока на него кто-то ссылается — без единого ручного delete.", "api": [{"sig": "struct FPropertyDesc { FString Name; size_t Offset; EPropertyType Type; }", "desc": "Описание одного поля класса: как называется, на каком байтовом смещении внутри объекта лежит, какого типа."}, {"sig": "class FClassDesc { TArray<FPropertyDesc> Properties; FClassDesc* SuperClass; UObject* (*Constructor)(); }", "desc": "Описание целого класса — по сути твой аналог RTTI, только с полным списком полей, а не только именем типа."}, {"sig": "void GenerateReflectionData()", "desc": "Шаг кодогенерации (или парсер твоих же заголовков), который заполняет FClassDesc для каждого класса — руками их не пишут, это как раз то, что у Epic делает Chill Header Tool."}, {"sig": "void CollectGarbage()", "desc": "Точка входа сборщика мусора: Mark() от корней, затем Sweep() удаляет непомеченное."}], "blocks": [{"type": "h", "text": "Рефлексия своими руками"}, {"type": "p", "text": "Смысл: у тебя должна появиться возможность на лету, зная только указатель на объект и его FClassDesc, прочитать/записать любое поле по имени — не зная заранее C++-тип класса. Это и есть основа сериализации, Details-панели редактора и VibeScript."}, {"type": "code", "text": "void SetPropertyByName(void* Object, FClassDesc* Class, const FString& Name, const void* Value) {\n    for (auto& Prop : Class->Properties)\n        if (Prop.Name == Name) {\n            memcpy((uint8*)Object + Prop.Offset, Value, SizeOf(Prop.Type));\n            return;\n        }\n}"}, {"type": "p", "text": "Заполнять FClassDesc руками для каждого поля — боль и источник багов. Поэтому в реальных движках пишут отдельную программу (кодогенератор), которая парсит твои .h файлы, видит специальную разметку у поля (например макрос REFLECT()), и сама генерирует .cpp с массивом FPropertyDesc. Это отдельная, посильная учебная задача — свой мини-UHT."}, {"type": "h", "text": "Mark-and-Sweep сборка мусора"}, {"type": "p", "text": "Идея в два прохода. Mark: берёшь набор «корней» (глобальные объекты, статические переменные, стек вызовов) и рекурсивно проходишь по всем ссылочным полям (используя ту же рефлексию — ты же знаешь, какие поля являются указателями на другие отражаемые объекты!), помечая каждый достигнутый объект флагом Reachable. Sweep: проходишь по списку ВСЕХ созданных объектов и удаляешь те, что не помечены."}, {"type": "code", "text": "void Mark(UObject* Obj, TSet<UObject*>& Visited) {\n    if (!Obj || Visited.Contains(Obj)) return;\n    Visited.Add(Obj);\n    for (auto& Prop : Obj->GetClass()->Properties)\n        if (Prop.Type == EPropertyType::ObjectPointer) {\n            UObject* Ref = *(UObject**)((uint8*)Obj + Prop.Offset);\n            Mark(Ref, Visited);\n        }\n}\nvoid Sweep(TSet<UObject*>& Visited) {\n    for (UObject* Obj : AllObjects)\n        if (!Visited.Contains(Obj)) delete Obj;\n}"}], "connects": "Engine строит World/Actor/Component поверх этих же UObject — то есть Actor это просто класс с FClassDesc, а сборщик мусора решает, когда удалять акторы. Slate/PropertyEditor используют ту же рефлексию, чтобы автоматически рисовать панель Details для любого твоего класса.", "study": ["reflection / RTTI своими руками", "mark-and-sweep garbage collection", "написание простого парсера заголовков (кодогенерация)"]}, "Engine": {"intro": "Engine — это композиция (Actor из Component) плюс единый игровой цикл (Tick). Разобранным считается, если у тебя есть класс мира, который каждый кадр обходит все объекты и вызывает их Tick, а объект собирается из независимых компонентов (например Mesh + Physics + Movement), а не через наследование «на всё».", "api": [{"sig": "class AActor { TArray<UActorComponent*> Components; FTransform Transform; }", "desc": "Контейнер компонентов + положение в мире. У Actor почти нет своей логики — вся логика в компонентах."}, {"sig": "template<T> T* AddComponent()", "desc": "Создаёт компонент нужного типа, кладёт в массив, вызывает его OnAttached(this)."}, {"sig": "virtual void UActorComponent::TickComponent(float DeltaTime)", "desc": "То, что переопределяет каждый конкретный компонент — его собственная логика на один кадр."}, {"sig": "class UWorld { TArray<AActor*> Actors; void Tick(float dt) }", "desc": "Главный цикл: раз в кадр обходит все Actor и их компоненты и зовёт TickComponent."}], "blocks": [{"type": "h", "text": "Почему композиция, а не наследование"}, {"type": "p", "text": "Если бы падающая бочка наследовалась от «PhysicsActor», а летающая птица — от «FlyingActor», ты бы не смог сделать «летающую бочку» без копипасты. Компонентная модель решает это: AActor — просто список компонентов, и «физика» — это компонент UPhysicsComponent, который можно прицепить куда угодно."}, {"type": "code", "text": "class AActor {\n    TArray<UActorComponent*> Components;\n    template<typename T> T* AddComponent() {\n        T* C = new T();\n        C->Owner = this;\n        Components.Add(C);\n        return C;\n    }\n    template<typename T> T* GetComponent() {\n        for (auto* C : Components) if (auto* Typed = Cast<T>(C)) return Typed;\n        return nullptr;\n    }\n};"}, {"type": "h", "text": "Игровой цикл"}, {"type": "code", "text": "void UWorld::Tick(float dt) {\n    for (AActor* A : Actors)\n        for (UActorComponent* C : A->Components)\n            if (C->bTickEnabled) C->TickComponent(dt);\n}"}, {"type": "p", "text": "Именно здесь физический компонент на каждом Tick вызывает Integrate() (см. Tsiolkovsky), движение персонажа — свой пересчёт (см. Net/IrisCore), а рендер-компонент просто передаёт свою Transform в Renderer."}], "connects": "Physics-компонент, который ты пишешь для Tsiolkovsky, цепляется сюда через AddComponent<UPhysicsComponent>(). Компонент движения персонажа получает ввод из InputCore и отправляет его в Net. Именно Engine — тот «клей», который вызывает всё остальное каждый кадр.", "study": ["entity-component pattern (не путать с ECS/Data-Oriented — это композиция объектов, а не структуры массивов)", "game loop / fixed vs variable timestep"]}, "PhysicsCore": {"intro": "Это не солвер, а словарь физики: какие вообще бывают физические свойства объекта. Разобранным считается, если у тебя есть структура «тело» с массой/инерцией и структура «материал» с трением/упругостью, которые солвер (Tsiolkovsky) читает, а не выдумывает сам.", "api": [{"sig": "struct FPhysicalMaterial { float Friction; float Restitution; float Density; }", "desc": "Трение (сопротивление скольжению), упругость (доля энергии, сохраняемая при ударе: 0 = не отскакивает, 1 = отскакивает идеально), плотность (масса = плотность x объём)."}, {"sig": "struct FMassProperties { float Mass; FMatrix3x3 InertiaTensor; FVector CenterOfMass; }", "desc": "Масса — сопротивление линейному ускорению. Тензор инерции — то же самое, но для вращения, и он разный по разным осям для несимметричных тел."}, {"sig": "FMassProperties ComputeMassProperties(const FCollisionShape& Shape, float Density)", "desc": "Считает массу и тензор инерции ИЗ ФОРМЫ (для коробки, сферы, капсулы есть готовые формулы) — так объект «сам» получает реалистичную массу вместо того, чтобы её вводить руками."}], "blocks": [{"type": "p", "text": "Формула массы для сферы: Mass = Density * (4/3) * pi * r^3. Для коробки: Mass = Density * (Width*Height*Depth). Тензор инерции сферы: I = (2/5) * Mass * r^2 по всем трём осям (симметрично). Именно из-за этой формулы шар крутится «легче», чем длинная палка той же массы — у палки инерция по длинной оси меньше, чем поперёк."}, {"type": "p", "text": "Этот модуль сам ничего не двигает и не проверяет столкновений — это чистые данные и формулы, которые читает солвер (Tsiolkovsky)."}], "connects": "Tsiolkovsky на каждый Tick читает FMassProperties тела, чтобы посчитать ускорение (F=ma -> a=F/m), и FPhysicalMaterial обоих тел при контакте, чтобы посчитать итоговое трение/упругость столкновения.", "study": ["как считается тензор инерции для базовых форм (сфера/коробка/капсула)", "смысл коэффициента restitution в законе сохранения импульса"]}, "Tsiolkovsky": {"intro": "Это прямой ответ на «как физика заставляет объект падать»: гравитация — это просто сила, применённая на каждом кадре ко всем телам с массой, а дальше цикл интеграции и коллизий превращает силу в движение. Разобранным считается, если шар с массой падает вниз под гравитацией с ускорением около 9.8 м/с2 и останавливается на полу, не проваливаясь сквозь него.", "api": [{"sig": "void FRigidBody::AddForce(FVector Force)", "desc": "Копит силу в аккумулятор на этот кадр (не двигает объект сразу!). Гравитация — это просто AddForce(FVector(0,0,-9.8f) * Mass) каждый кадр."}, {"sig": "void FRigidBody::AddImpulse(FVector Impulse)", "desc": "Мгновенно меняет скорость: Velocity += Impulse / Mass. Используется для взрывов, прыжков, разрешения столкновений — в отличие от силы, импульс не умножается на dt."}, {"sig": "void FRigidBody::Integrate(float dt)", "desc": "Превращает накопленную силу в новую скорость и позицию, затем обнуляет аккумулятор силы."}, {"sig": "bool BroadPhase(TArray<FRigidBody*>& Bodies, TArray<FPair>& OutCandidatePairs)", "desc": "Быстро (без точной геометрии) находит пары тел, чьи bounding box пересекаются — чтобы не проверять точную коллизию для каждой пары тел в мире (это было бы O(n^2) с большой константой)."}, {"sig": "bool NarrowPhase(const FRigidBody& A, const FRigidBody& B, FContact& OutContact)", "desc": "Точная геометрическая проверка пересечения (для коробок — SAT, для произвольных выпуклых форм — GJK) — возвращает точку контакта, нормаль и глубину проникновения."}, {"sig": "void ResolveCollision(FContact& Contact)", "desc": "Вычисляет импульс, который надо приложить к обоим телам, чтобы они перестали проникать друг в друга (с учётом Restitution и Friction из PhysicsCore)."}], "blocks": [{"type": "h", "text": "Шаг 1 — интеграция (почему объект падает)"}, {"type": "code", "text": "void FRigidBody::Integrate(float dt) {\n    FVector Acceleration = AccumulatedForce / Mass;   // F = m*a  =>  a = F/m\n    Velocity += Acceleration * dt;                     // v += a*dt\n    Position += Velocity * dt;                          // x += v*dt (semi-implicit Euler)\n    AccumulatedForce = FVector::ZeroVector;\n}"}, {"type": "p", "text": "Это называется semi-implicit (симплектический) Euler — используется новая (уже обновлённая) скорость для сдвига позиции, а не старая. Так стабильнее, чем «честный» explicit Euler. Цикл мира: каждый кадр — AddForce(Gravity*Mass) для всех тел, затем Integrate(dt) для всех тел. Вот и всё «падение» — больше там ничего нет."}, {"type": "h", "text": "Шаг 2 — почему объект не проваливается сквозь пол (broad + narrow phase)"}, {"type": "p", "text": "После интеграции тела могли залезть друг в друга. Broad phase — грубый быстрый отсев: раздели мир на сетку ячеек (spatial hash) или отсортируй bounding box по одной оси (sweep-and-prune) и сравнивай только соседей — это на порядки быстрее, чем сравнивать все тела со всеми. Narrow phase — точная проверка для оставшихся пар-кандидатов: для коробок проще всего Separating Axis Theorem (SAT) — если существует ось, на которую проекции двух коробок не пересекаются, коробки не пересекаются."}, {"type": "h", "text": "Шаг 3 — разрешение столкновения (sequential impulse)"}, {"type": "code", "text": "void ResolveCollision(FContact& C) {\n    float RelVel = Dot(C.B->Velocity - C.A->Velocity, C.Normal);\n    if (RelVel > 0) return; // уже разлетаются\n    float e = min(C.A->Material.Restitution, C.B->Material.Restitution);\n    float invMassSum = 1/C.A->Mass + 1/C.B->Mass;\n    float j = -(1+e) * RelVel / invMassSum;          // величина импульса\n    FVector Impulse = j * C.Normal;\n    C.A->AddImpulse(-Impulse);\n    C.B->AddImpulse( Impulse);\n    // + позиционная коррекция: вытолкнуть тела на C.PenetrationDepth вдоль Normal\n}"}, {"type": "p", "text": "Это и есть «пол не проваливается»: пол — тело с Mass=бесконечность (или флагом Static), после AddImpulse импульс делится на 1/Mass — для статики 1/бесконечность=0, то есть пол не сдвигается, а падающий шар получает импульс вверх ровно такой, чтобы его скорость вдоль нормали стала нулевой/отрицательной (с учётом Restitution)."}], "connects": "Компонент UPhysicsComponent в Engine на каждом TickComponent зовёт FRigidBody::Integrate(dt), затем весь мир прогоняет Broad/NarrowPhase + ResolveCollision один раз за кадр для всех тел сразу, а результат (новая Position) компонент записывает обратно в AActor::Transform, откуда его уже читает Renderer.", "study": ["semi-implicit Euler интеграция", "Separating Axis Theorem (SAT) для коллизий коробок", "sequential impulse solver (тот же подход, что в Box2D)"]}, "RHI": {"intro": "RHI — это не рендер, а просто «переводчик» одинаковых команд на разные видеокарты. Разобранным считается, если у тебя есть один и тот же вызов DrawIndexed(), который под капотом на Windows дёргает Direct3D, а на Linux — Vulkan, и твой код рендера этого не замечает.", "api": [{"sig": "class FCommandList { void SetPipelineState(...); void SetVertexBuffer(...); void DrawIndexed(int Count); }", "desc": "Список команд, которые накапливаются на CPU и потом одним куском отправляются на GPU — так GPU не ждёт CPU команда за командой."}, {"sig": "FBufferHandle CreateBuffer(EBufferUsage Usage, size_t Size)", "desc": "Просит у драйвера кусок GPU-памяти. Usage (Vertex/Index/Uniform) влияет на то, в какой физической памяти (VRAM/shared) он окажется."}, {"sig": "FPipelineStateHandle CreatePipelineState(FShader* VS, FShader* PS, FRenderState State)", "desc": "«Заморозка» связки шейдер+блендинг+depth-test в один объект — на реальном железе смена этой связки дорогая, поэтому её готовят заранее, а не выставляют по одному стейту за раз."}, {"sig": "void TransitionResource(FResourceHandle R, EResourceState From, EResourceState To)", "desc": "Барьер: явно говорит GPU «этот ресурс только что использовался как результат рендера, а сейчас его будут читать как текстуру» — без этого можно словить гонку данных между этапами GPU-конвейера."}], "blocks": [{"type": "p", "text": "Ключевая идея абстракции — общий интерфейс, у которого под каждый API (D3D12/Vulkan/Metal) есть своя реализация одного и того же виртуального метода. FCommandList::DrawIndexed() на Windows вызывает ID3D12GraphicsCommandList::DrawIndexedInstanced, на Linux — vkCmdDrawIndexed. Твой код рендера (Renderer) зовёт только абстрактный метод."}, {"type": "code", "text": "class IRHICommandList {\npublic:\n    virtual void DrawIndexed(int IndexCount) = 0;\n};\nclass FD3D12CommandList : public IRHICommandList {\n    void DrawIndexed(int IndexCount) override { D3DList->DrawIndexedInstanced(IndexCount,1,0,0,0); }\n};\nclass FVulkanCommandList : public IRHICommandList {\n    void DrawIndexed(int IndexCount) override { vkCmdDrawIndexed(VkList, IndexCount,1,0,0,0); }\n};"}, {"type": "p", "text": "Почему нужны явные Transition/барьеры: современные GPU API (в отличие от старого OpenGL) требуют, чтобы ты сам сказал драйверу «эта текстура только что была отрендерена, а сейчас будет читаться шейдером» — иначе GPU может начать читать данные до того, как предыдущий этап дописал их (гонка)."}], "connects": "RenderCore строит поверх этого свой render graph — то есть граф сам решает, когда вызывать TransitionResource и в каком порядке звать команды из FCommandList, а RHI просто честно исполняет то, что ему сказали.", "study": ["архитектура command buffer / GPU конвейера", "зачем нужны resource state transitions (barrier) в D3D12/Vulkan"]}, "RenderCore": {"intro": "Вот он, твой собственный «граф» вместо графа разработчиков — именно об этом вы спрашивали. Render graph — это способ ОПИСАТЬ кадр как набор проходов с их входами/выходами, а не звать команды руками в жёстком порядке. Разобранным считается, если ты можешь добавить новый проход рендера, просто описав какие ресурсы он читает/пишет, а память и порядок выполнения граф посчитает сам.", "api": [{"sig": "FGraphResourceHandle CreateTexture(FTextureDesc Desc)", "desc": "Регистрирует ресурс В ОПИСАНИИ графа — это не выделяет память сразу, это просто «обещание», что такой ресурс понадобится."}, {"sig": "void AddPass(FString Name, TArray<FGraphResourceHandle> Reads, TArray<FGraphResourceHandle> Writes, TFunction<void(FCommandList&)> Execute)", "desc": "Регистрирует один проход рендера: что он читает, что пишет, и лямбду с реальными draw call, которая выполнится позже."}, {"sig": "void Compile()", "desc": "Строит граф зависимостей между проходами, топологически сортирует, считает время жизни каждого ресурса, решает какие ресурсы могут делить одну и ту же память (aliasing), расставляет барьеры."}, {"sig": "void Execute(FCommandList& CmdList)", "desc": "Проходит по отсортированным проходам и реально вызывает их Execute-лямбды поверх RHI."}], "blocks": [{"type": "h", "text": "Почему просто список команд — плохая идея"}, {"type": "p", "text": "Если писать рендер кадра как жёсткую последовательность вызовов руками, любое изменение (добавить проход теней, убрать bloom) требует руками пересчитывать, какие ресурсы ещё живы, когда вставлять барьеры, где выделять память под промежуточные текстуры. Render graph переворачивает это: ты просто ОПИСЫВАЕШЬ проходы декларативно, а граф сам считает порядок и память."}, {"type": "h", "text": "Как выглядит объявление одного прохода"}, {"type": "code", "text": "auto SceneColor = Graph.CreateTexture({1920,1080, EFormat::RGBA16F});\nauto DepthBuffer = Graph.CreateTexture({1920,1080, EFormat::D32});\n\nGraph.AddPass(\"BasePass\", {}, {SceneColor, DepthBuffer}, [=](FCommandList& CL){\n    CL.SetRenderTargets(SceneColor, DepthBuffer);\n    DrawAllOpaqueMeshes(CL);\n});\n\nGraph.AddPass(\"Bloom\", {SceneColor}, {BloomResult}, [=](FCommandList& CL){\n    ApplyBloomShader(CL, SceneColor, BloomResult);\n});"}, {"type": "p", "text": "Заметь: ты нигде не написал \"сначала BasePass, потом Bloom\" — граф сам понимает порядок, потому что Bloom читает SceneColor, а BasePass его пишет. Это и есть зависимость: pass X должен выполниться раньше pass Y, если X.Writes пересекается с Y.Reads."}, {"type": "h", "text": "Compile() — три задачи, которые граф решает сам"}, {"type": "code", "text": "void Compile() {\n    // 1. построить рёбра: для каждой пары проходов, если Reads(B) пересекается с Writes(A) -> ребро A->B\n    BuildDependencyEdges();\n    // 2. топологическая сортировка (Kahn/DFS) -> порядок исполнения\n    SortedPasses = TopologicalSort(Passes);\n    // 3. для каждого ресурса найти первый и последний pass, где он используется\n    for (auto& Res : Resources) {\n        Res.FirstUse = FindFirstUsingPass(Res);\n        Res.LastUse  = FindLastUsingPass(Res);\n    }\n    // ресурсы с непересекающимися интервалами [FirstUse, LastUse] могут переиспользовать одну память\n    AllocateWithAliasing(Resources);\n    InsertBarriers(SortedPasses);\n}"}, {"type": "p", "text": "Топологическая сортировка — классика: у каждого прохода счётчик \"сколько проходов должно выполниться раньше\" (in-degree); в очередь кладутся проходы с in-degree==0; при выполнении прохода у всех, кто от него зависел, in-degree уменьшается; если дошло до 0 — тоже в очередь. Порядок извлечения из очереди — и есть порядок исполнения."}], "connects": "Execute() графа вызывает RHI::FCommandList для реальной отрисовки. Renderer использует этот граф, объявляя проходы GBuffer/Lighting/PostProcess как отдельные AddPass — то есть Renderer это просто «набор описаний проходов», а вся хитрая логика планирования — в этом модуле.", "study": ["Frame Graph / Render Graph паттерн (доклад Yuriy O'Donnell, GDC 2017 — концепция, не код Epic)", "топологическая сортировка DAG (Kahn's algorithm)", "resource aliasing по времени жизни"]}, "Renderer": {"intro": "Это применение render graph (см. RenderCore) к конкретной задаче — нарисовать один кадр 3D-сцены. Разобранным считается, если у тебя есть минимум 3 последовательных прохода (геометрия -> освещение -> пост-процесс), каждый из которых — отдельный AddPass с явными входами/выходами.", "api": [{"sig": "void AddDepthPrePass(FRenderGraph&, const TArray<FMeshDraw>&)", "desc": "Рисует только глубину (без цвета) — чтобы потом основной проход не тратил шейдеры на пиксели, которые всё равно перекроются (early-Z отсечение)."}, {"sig": "void AddBasePass(FRenderGraph&, const TArray<FMeshDraw>&)", "desc": "Рисует геометрию в несколько буферов сразу (G-Buffer): альбедо, нормали, шероховатость — это и называется deferred shading."}, {"sig": "void AddLightingPass(FRenderGraph&, const TArray<FLight>&)", "desc": "Для каждого пикселя читает G-Buffer и считает итоговый цвет от всех источников света — именно поэтому deferred быстрее при многих источниках света: расчёт освещения делается один раз на пиксель, а не на каждый треугольник для каждого света."}, {"sig": "void AddPostProcessPass(FRenderGraph&)", "desc": "Bloom, тонмаппинг, цветокоррекция — обрабатывает уже готовое изображение как обычную 2D-текстуру."}], "blocks": [{"type": "p", "text": "Почему сначала глубина, потом цвет (Depth Pre-Pass): GPU умеет очень дёшево проверить, что этот пиксель точно будет перекрыт другим, более близким объектом, ДО того, как посчитает дорогой шейдер освещения — но только если буфер глубины уже заполнен. Поэтому сначала быстро рисуют только глубину, а тяжёлый цветной проход идёт вторым и автоматически пропускает невидимые пиксели (early-Z)."}, {"type": "p", "text": "Deferred shading — это отдельная от Depth Pre-Pass идея: вместо того чтобы для каждого треугольника считать освещение от всех источников света сразу (дорого при многих источниках), сначала просто «фотографируют» поверхность в несколько текстур (G-Buffer: цвет, нормаль, шероховатость), а затем ОДИН проход обходит уже готовые пиксели экрана и для каждого считает свет — количество источников света больше не умножается на количество треугольников."}, {"type": "code", "text": "FGraphResourceHandle GBufferColor = Graph.CreateTexture(...);\nFGraphResourceHandle GBufferNormal = Graph.CreateTexture(...);\nFGraphResourceHandle SceneColor = Graph.CreateTexture(...);\n\nGraph.AddPass(\"BasePass\", {}, {GBufferColor, GBufferNormal}, [=](auto& CL){ /* рисуем меши в 2 таргета сразу */ });\nGraph.AddPass(\"Lighting\", {GBufferColor, GBufferNormal}, {SceneColor}, [=](auto& CL){ /* full-screen quad, читает G-Buffer, пишет SceneColor */ });"}], "connects": "Каждый AddXPass здесь — это просто вызов RenderCore::FRenderGraph::AddPass; конкретные draw call внутри лямбды идут через RHI::FCommandList. Данные о мешах/светах Renderer получает из Engine (Actor со Static Mesh Component и Light Component).", "study": ["deferred vs forward shading — плюсы/минусы", "early-Z отсечение и depth pre-pass"]}, "NetCore": {"intro": "Это транспортный уровень: как вообще пакеты доезжают от клиента до сервера, не теряясь бесследно. Разобранным считается, если у тебя есть своя надёжная доставка поверх UDP (свой ACK/resend), а не просто голый sendto().", "api": [{"sig": "void SendPacket(uint8* Data, int Size, bool bReliable)", "desc": "Отправляет пакет. Если bReliable — запоминает его в буфере «ждёт подтверждения» с порядковым номером."}, {"sig": "void OnPacketReceived(uint8* Data, int Size)", "desc": "Разбирает заголовок пакета (номер, какие номера уже получены), передаёт полезную нагрузку выше по стеку (в IrisCore/Engine)."}, {"sig": "void Tick(float dt)", "desc": "Раз в кадр/тик проверяет: какие reliable-пакеты не подтверждены дольше RTT*2 — пересылает их заново."}], "blocks": [{"type": "p", "text": "UDP сам по себе не гарантирует ни доставку, ни порядок — пакеты могут потеряться или прийти не в том порядке. Поэтому поверх него строят свой протокол: у каждого пакета — растущий номер (sequence number); получатель шлёт обратно, какие номера он получил (ACK, обычно битовой маской последних 32 номеров, чтобы не гнать отдельный ACK-пакет на каждый пакет); отправитель, не увидев ACK за разумное время (обычно около 2xRTT), пересылает пакет заново."}, {"type": "code", "text": "struct FReliablePacket { uint32 Seq; float SentTime; TArray<uint8> Data; };\nTArray<FReliablePacket> UnackedPackets;\n\nvoid Tick(float dt) {\n    for (auto& P : UnackedPackets)\n        if (Now() - P.SentTime > RTT*2) { RawSend(P.Data); P.SentTime = Now(); }\n}\nvoid OnAckReceived(uint32 AckedSeq, uint32 AckBitmask) {\n    UnackedPackets.RemoveAll([&](auto& P){ return IsAcked(P.Seq, AckedSeq, AckBitmask); });\n}"}], "connects": "IrisCore кладёт сюда уже сериализованные изменения состояния объектов, а этот модуль просто гарантирует их доставку и говорит верхнему уровню, какие данные реально доехали.", "study": ["reliable UDP / ACK+resend протоколы (как в QUIC, GameNetworkingSockets)", "sequence number + bitmask ACK"]}, "Networking": {"intro": "Это транспортный уровень: как вообще пакеты доезжают от клиента до сервера, не теряясь бесследно. Разобранным считается, если у тебя есть своя надёжная доставка поверх UDP (свой ACK/resend), а не просто голый sendto().", "api": [{"sig": "void SendPacket(uint8* Data, int Size, bool bReliable)", "desc": "Отправляет пакет. Если bReliable — запоминает его в буфере «ждёт подтверждения» с порядковым номером."}, {"sig": "void OnPacketReceived(uint8* Data, int Size)", "desc": "Разбирает заголовок пакета (номер, какие номера уже получены), передаёт полезную нагрузку выше по стеку (в IrisCore/Engine)."}, {"sig": "void Tick(float dt)", "desc": "Раз в кадр/тик проверяет: какие reliable-пакеты не подтверждены дольше RTT*2 — пересылает их заново."}], "blocks": [{"type": "p", "text": "UDP сам по себе не гарантирует ни доставку, ни порядок — пакеты могут потеряться или прийти не в том порядке. Поэтому поверх него строят свой протокол: у каждого пакета — растущий номер (sequence number); получатель шлёт обратно, какие номера он получил (ACK, обычно битовой маской последних 32 номеров, чтобы не гнать отдельный ACK-пакет на каждый пакет); отправитель, не увидев ACK за разумное время (обычно около 2xRTT), пересылает пакет заново."}, {"type": "code", "text": "struct FReliablePacket { uint32 Seq; float SentTime; TArray<uint8> Data; };\nTArray<FReliablePacket> UnackedPackets;\n\nvoid Tick(float dt) {\n    for (auto& P : UnackedPackets)\n        if (Now() - P.SentTime > RTT*2) { RawSend(P.Data); P.SentTime = Now(); }\n}\nvoid OnAckReceived(uint32 AckedSeq, uint32 AckBitmask) {\n    UnackedPackets.RemoveAll([&](auto& P){ return IsAcked(P.Seq, AckedSeq, AckBitmask); });\n}"}], "connects": "IrisCore кладёт сюда уже сериализованные изменения состояния объектов, а этот модуль просто гарантирует их доставку и говорит верхнему уровню, какие данные реально доехали.", "study": ["reliable UDP / ACK+resend протоколы (как в QUIC, GameNetworkingSockets)", "sequence number + bitmask ACK"]}, "IrisCore": {"intro": "Вот прямой ответ на вопрос «как сервер реально считает позицию игрока и заставляет клиент это выполнить». Ключевая идея — client-side prediction + server reconciliation: клиент не ждёт ответа сервера, чтобы двигаться, но финальное слово всегда за сервером. Разобранным считается, если персонаж у игрока двигается без задержки локально, а при рассинхроне с сервером плавно «доезжает» до правильной позиции, а не телепортируется.", "api": [{"sig": "struct FMoveInput { uint32 SequenceNumber; FVector2D InputDirection; float DeltaTime; }", "desc": "То, что клиент реально отправляет — НЕ позицию, а намерение (ввод) с уникальным номером."}, {"sig": "void Client_Tick(float dt)", "desc": "Читает ввод игрока, локально сразу применяет движение (предсказание), запоминает этот ввод в очереди «неподтверждённых», отправляет ввод на сервер."}, {"sig": "void Server_OnMoveReceived(FMoveInput Input)", "desc": "Сервер применяет движение ТЕМ ЖЕ САМЫМ кодом, что и клиент — это критично, иначе результаты разойдутся. Затем проверяет на читерство (скорость/коллизии) и реплицирует получившееся состояние обратно."}, {"sig": "void Client_OnServerStateReceived(FServerState State)", "desc": "Если серверная позиция для этого SequenceNumber отличается от того, что клиент предсказал — откатывается на серверную позицию и заново проигрывает («replay») все ещё неподтверждённые вводы поверх неё."}], "blocks": [{"type": "h", "text": "Почему просто ждать ответа сервера нельзя"}, {"type": "p", "text": "Если бы клиент отправлял ввод и ждал, пока сервер посчитает и пришлёт новую позицию, при пинге 100мс персонаж двигался бы с полусекундной задержкой — играть невозможно. Решение: клиент сразу двигает себя локально по тому же алгоритму, что использует сервер («предсказание»), а сервер тем временем считает то же самое независимо и является единственным источником правды."}, {"type": "h", "text": "Полный цикл"}, {"type": "code", "text": "// КЛИЕНТ, каждый кадр:\nvoid Client_Tick(float dt) {\n    FMoveInput Input = ReadPlayerInput(dt);\n    Input.SequenceNumber = NextSeq++;\n    PendingInputs.Add(Input);\n    ApplyMovement(LocalCharacterState, Input);   // локально двигаем СРАЗУ, без ожидания\n    SendToServer(Input);                          // шлём ВВОД, не позицию (иначе читер шлёт любую позицию)\n}\n\n// СЕРВЕР, при получении пакета:\nvoid Server_OnMoveReceived(FMoveInput Input) {\n    ApplyMovement(AuthoritativeState, Input);     // ТОТ ЖЕ САМЫЙ код движения, что на клиенте!\n    if (!IsPlausible(AuthoritativeState)) RejectAndCorrect();  // анти-чит\n    Replicate(AuthoritativeState, Input.SequenceNumber);       // шлём назад результат + какой Seq подтверждён\n}\n\n// КЛИЕНТ, при получении подтверждения от сервера:\nvoid Client_OnServerStateReceived(FServerState State) {\n    FVector Predicted = FindPredictedPositionAtSeq(State.AckedSeq);\n    if (Distance(Predicted, State.Position) > ErrorThreshold) {\n        LocalCharacterState = State;              // откатываемся на правду сервера\n        for (auto& In : PendingInputs)             // и переигрываем всё, что сервер ещё не видел\n            if (In.SequenceNumber > State.AckedSeq) ApplyMovement(LocalCharacterState, In);\n    }\n    PendingInputs.RemoveAll(In.SequenceNumber <= State.AckedSeq);\n}"}, {"type": "p", "text": "Заметь ключевое правило: сервер и клиент двигают персонажа ОДНОЙ И ТОЙ ЖЕ функцией ApplyMovement() — иначе результаты неизбежно разойдутся при любом пинге. Это то место, где 99% самодельных сетевых движений ломаются."}, {"type": "h", "text": "А для чужих игроков (не тебя)"}, {"type": "p", "text": "Для персонажей других игроков предсказание не применяют (у тебя нет их ввода) — вместо этого используют интерполяцию: держат 2 последних полученных от сервера состояния и на клиенте плавно (lerp) двигаются между ними с небольшой задержкой (обычно около 100мс), чтобы сгладить дискретные обновления по сети в плавное движение."}], "connects": "Использует NetCore/Net для физической доставки пакетов. AuthoritativeState на сервере обновляет тот же UActorComponent (движение персонажа), что живёт в Engine — то есть «Runtime реально выполняет действие» происходит внутри обычного TickComponent, просто у сервера ApplyMovement вызывается из Server_OnMoveReceived, а не из чтения локальной клавиатуры.", "study": ["client-side prediction + server reconciliation (классика — статьи Gabriel Gambetta \"Fast-Paced Multiplayer\")", "entity interpolation для удалённых игроков", "почему нельзя доверять клиенту (анти-чит на уровне сервера)"]}, "InputCore": {"intro": "Маленький, но принципиальный модуль: превращение сырого события ОС («нажата клавиша #65») в понятное игре событие («нажата W»). Разобранным считается, если у тебя есть таблица код-клавиши -> имя и система подписки «дай мне знать, когда нажмут W».", "api": [{"sig": "struct FKey { FName Name; }", "desc": "Просто именованный идентификатор клавиши/кнопки — платформонезависимый (не привязан к конкретному коду ОС)."}, {"sig": "void OnRawKeyEvent(uint32 PlatformKeyCode, bool bPressed)", "desc": "Точка входа от ОС/ApplicationCore: переводит платформенный код в FKey через таблицу соответствия и рассылает подписчикам."}, {"sig": "FDelegateHandle BindKey(FKey Key, TFunction<void()> Callback)", "desc": "Позволяет любому коду подписаться: «позови меня, когда нажмут именно эту клавишу»."}], "blocks": [{"type": "p", "text": "Ключевая причина существования этого слоя — у Windows/Mac/Linux/консолей разные числовые коды для одной и той же физической клавиши. Таблица трансляции (платформенный код -> твой FKey) позволяет остальному коду вообще не знать, на какой ОС он запущен."}, {"type": "code", "text": "TMap<uint32, FKey> PlatformKeyMap = { {0x57, FKey(\"W\")}, {0x41, FKey(\"A\")} };\nTMultiMap<FKey, TFunction<void()>> Subscribers;\n\nvoid OnRawKeyEvent(uint32 Code, bool bPressed) {\n    FKey Key = PlatformKeyMap[Code];\n    if (bPressed) for (auto& Cb : Subscribers.Find(Key)) Cb();\n}"}], "connects": "ApplicationCore зовёт OnRawKeyEvent() при получении события окна от ОС. Компонент движения персонажа в Engine подписывается через BindKey(), и когда вызывается его callback — формирует FMoveInput для Net/IrisCore.", "study": ["input abstraction layer / device-independent key codes"]}, "Slate": {"intro": "Retained-mode UI: в отличие от immediate-mode (где ты каждый кадр заново «рисуешь» кнопку кодом), здесь дерево виджетов живёт между кадрами, и у каждого узла есть 3 отдельные обязанности — посчитать свой желаемый размер, разложиться в отведённом месте, нарисоваться. Разобранным считается, если у тебя есть контейнер (например вертикальный стек), который сам правильно распределяет место между двумя дочерними виджетами.", "api": [{"sig": "virtual FVector2D SWidget::ComputeDesiredSize() = 0", "desc": "Каждый виджет отвечает: «сколько места мне бы хотелось» — независимо от того, сколько ему реально дадут."}, {"sig": "virtual void SWidget::ArrangeChildren(FGeometry AllottedGeometry, TArray<FArrangedWidget>& OutChildren) = 0", "desc": "Контейнер (например SVerticalBox) решает, кому из детей сколько места реально выделить, основываясь на их DesiredSize и доступном пространстве."}, {"sig": "virtual void SWidget::OnPaint(FPaintContext& Context) = 0", "desc": "Не рисует напрямую на экран, а добавляет «элементы отрисовки» (прямоугольник, текст, картинка) в список, который потом одним проходом рисует RHI/RenderCore — так UI не тормозит на 1000 виджетах."}, {"sig": "SWidget* HitTest(FVector2D ScreenPos)", "desc": "Обходит дерево виджетов сверху (сначала верхние по Z), проверяя, чья геометрия содержит точку клика — так клик по кнопке находит именно кнопку, а не фон под ней."}], "blocks": [{"type": "h", "text": "Три прохода вместо одного"}, {"type": "p", "text": "Почему не рисовать сразу: контейнеру нужно сначала узнать, сколько места хотят все дети (ComputeDesiredSize), чтобы решить, как их всех уместить (ArrangeChildren), и только потом, зная финальную геометрию каждого — рисовать (OnPaint). Если бы рисовали сразу при вычислении размера, невозможно было бы сделать, например, центрирование по содержимому."}, {"type": "code", "text": "FVector2D SVerticalBox::ComputeDesiredSize() {\n    FVector2D Size(0,0);\n    for (auto& Child : Children) {\n        FVector2D ChildSize = Child->ComputeDesiredSize();\n        Size.X = Max(Size.X, ChildSize.X);\n        Size.Y += ChildSize.Y;   // высоты складываются, вертикальный стек\n    }\n    return Size;\n}\nvoid SVerticalBox::ArrangeChildren(FGeometry Allotted, TArray<FArrangedWidget>& Out) {\n    float CurrentY = 0;\n    for (auto& Child : Children) {\n        FVector2D ChildSize = Child->ComputeDesiredSize();\n        Out.Add({Child, FGeometry(0, CurrentY, ChildSize)});\n        CurrentY += ChildSize.Y;\n    }\n}"}], "connects": "OnPaint кладёт draw-элементы, которые в итоге через RenderCore/RHI попадают на экран тем же командным списком, что и 3D-сцена (просто отдельным проходом поверх неё). InputCore/ApplicationCore зовут HitTest, чтобы понять, по какому виджету кликнул пользователь.", "study": ["retained-mode vs immediate-mode UI", "constraint-based layout (desired size -> arrange -> paint)"]}, "AssetRegistry": {"intro": "Задача — найти нужный ассет среди тысяч файлов, не загружая каждый в память (это было бы очень медленно). Разобранным считается, если ты можешь спросить «дай мне все VibeScript класса Enemy» и получить ответ за миллисекунды, даже не открывая сами файлы полностью.", "api": [{"sig": "struct FAssetHeader { FString ClassName; FString Path; TMap<FName,FString> Tags; }", "desc": "То немногое, что читается из файла без полной загрузки — обычно это маленький заголовок в начале файла с именем класса и парой «тегов» (например для текстуры — её размер, для VibeScript — его родительский класс)."}, {"sig": "void ScanDirectory(FString Path)", "desc": "Проходит по всем файлам ассетов в папке, читает у каждого только FAssetHeader (не весь файл!), складывает в индекс."}, {"sig": "TArray<FAssetHeader> FindAssetsByClass(FString ClassName)", "desc": "Просто фильтрует уже построенный индекс в памяти — файлы на диске при этом не трогаются вообще."}], "blocks": [{"type": "p", "text": "Ключевая хитрость — формат файла ассета должен быть спроектирован так, чтобы нужные для поиска данные (класс, теги) лежали в начале файла одним маленьким блоком, а тяжёлые данные (сама геометрия меша, пиксели текстуры) — после. Тогда сканирование читает только первые несколько КБ каждого файла, а не мегабайты."}, {"type": "code", "text": "TMap<FString, TArray<FAssetHeader>> IndexByClass;\n\nvoid ScanDirectory(FString Dir) {\n    for (FString File : ListFiles(Dir, \"*.myasset\")) {\n        FAssetHeader H = ReadHeaderOnly(File);   // читает только первые N байт файла!\n        IndexByClass[H.ClassName].Add(H);\n    }\n}"}], "connects": "ContentBrowser (в реальном движке — Editor-модуль) строит своё дерево папок поверх этого индекса. Когда игра реально грузит ассет (LoadObject), она использует Path из FAssetHeader, но это уже не работа AssetRegistry — он только ищет, не грузит.", "study": ["индексация метаданных без полной загрузки данных", "почему формат файла (заголовок отдельно от тела) ускоряет поиск"]}, "GameplayTags": {"intro": "Иерархические строковые метки вида «Урон.Огонь.Взрыв» вместо кучи bool/enum-флагов. Разобранным считается, если у тебя тег Weapon.Melee.Sword проходит проверку «является ли Weapon» и «является ли Weapon.Melee», но не проходит «Weapon.Ranged».", "api": [{"sig": "struct FGameplayTag { int32 Handle; }", "desc": "Сам тег — это не строка в рантайме, а маленькое число (handle) в таблицу интернирования — сравнивать два тега это просто сравнить два int, а не строки."}, {"sig": "FGameplayTag RequestTag(FString TagString)", "desc": "Один раз находит/регистрирует строку в общей таблице и возвращает handle. Повторный вызов с той же строкой вернёт тот же handle."}, {"sig": "bool FGameplayTag::MatchesTag(FGameplayTag Other)", "desc": "Проверяет, является ли этот тег таким же или более специфичным потомком — Weapon.Melee.Sword.MatchesTag(Weapon) == true."}], "blocks": [{"type": "p", "text": "Почему не просто сравнивать строки: строковое сравнение медленное, и иерархию («это оружие ближнего боя, значит оно оружие вообще») строкой в лоб не проверить без парсинга точек каждый раз. Решение — при регистрации разбить строку по точкам и хранить дерево, а тегу выдать числовой handle; MatchesTag превращается в обход родителей по этому дереву (или ещё быстрее — сравнение префиксов заранее посчитанного битового пути)."}, {"type": "code", "text": "struct FTagNode { FString Segment; int32 ParentHandle; };\nTArray<FTagNode> TagTable;\nTMap<FString, int32> StringToHandle;\n\nbool MatchesTag(int32 Child, int32 Parent) {\n    int32 Cur = Child;\n    while (Cur != -1) {\n        if (Cur == Parent) return true;\n        Cur = TagTable[Cur].ParentHandle;\n    }\n    return false;\n}"}], "connects": "AIModule использует теги, чтобы Behavior Tree мог спросить «у цели есть тег Status.Stunned?» без жёсткой привязки к конкретному классу. GameplayTags — низкоуровневая утилита, которую вызывают геймплейные модули, а не наоборот.", "study": ["string interning (превращение строк в дешёвые для сравнения ID)", "иерархические классификаторы"]}, "AIModule": {"intro": "Behavior Tree — это просто дерево, которое обходят каждый тик, и каждый узел возвращает один из трёх статусов. Разобранным считается, если у тебя NPC умеет «если враг рядом — атаковать, иначе патрулировать» через дерево из готовых узлов, а не через if/else-простыню.", "api": [{"sig": "enum class EStatus { Success, Failure, Running }", "desc": "Три исхода выполнения любого узла на этом тике: получилось / не получилось / ещё выполняется (например анимация атаки ещё не доиграла)."}, {"sig": "virtual EStatus FBTNode::Tick(FBlackboard& BB, float dt) = 0", "desc": "Каждый узел (лист или композит) реализует свою логику одного тика и возвращает статус."}, {"sig": "class FBTSelector : public FBTNode", "desc": "Композит «ИЛИ»: тикает детей по очереди, останавливается на первом Success/Running (пробует варианты, пока один не сработает)."}, {"sig": "class FBTSequence : public FBTNode", "desc": "Композит «И»: тикает детей по очереди, останавливается на первом Failure/Running (все шаги должны получиться подряд)."}, {"sig": "struct FBlackboard { TMap<FName, FVariant> Values; }", "desc": "Общая «память» дерева — сюда пишут TargetActor, HasLineOfSight и т.д., читают из любого узла."}], "blocks": [{"type": "h", "text": "Пример дерева и как оно тикает"}, {"type": "code", "text": "// Selector: \"атаковать ИЛИ патрулировать\"\n//   -> Sequence: \"если враг виден -> подойти -> атаковать\"\n//   -> Patrol\n\nEStatus FBTSelector::Tick(FBlackboard& BB, float dt) {\n    for (auto* Child : Children) {\n        EStatus S = Child->Tick(BB, dt);\n        if (S != EStatus::Failure) return S;   // нашли работающий вариант\n    }\n    return EStatus::Failure;  // вообще ничего не сработало\n}\n\nEStatus FBTSequence::Tick(FBlackboard& BB, float dt) {\n    for (auto* Child : Children) {\n        EStatus S = Child->Tick(BB, dt);\n        if (S != EStatus::Success) return S;   // застряли или ещё выполняется\n    }\n    return EStatus::Success;  // все шаги подряд получились\n}"}, {"type": "p", "text": "«Является ли враг видимым» — это узел-условие (лист), который просто читает BB.Values[\"HasLineOfSight\"] (эту переменную отдельно, раз в N тиков, обновляет специальный «Service»-узел с помощью линии видимости/raycast — сам Selector этим не занимается)."}], "connects": "AIController каждый тик зовёт корневой узел дерева. Условия внутри узлов часто проверяют GameplayTags цели (Status.Stunned?), а движение NPC к цели использует NavigationSystem для построения пути.", "study": ["Behavior Tree паттерн (Selector/Sequence/Decorator/Service)", "Blackboard как shared state между узлами дерева"]}, "NavigationSystem": {"intro": "Как NPC находит путь вокруг стен. Два независимых шага: сначала один раз строится NavMesh (упрощённая карта «где можно ходить»), затем на этой карте многократно ищется путь алгоритмом A*. Разобранным считается, если NPC обходит стену, а не идёт напролом по прямой к игроку.", "api": [{"sig": "void BuildNavMesh(const TArray<FTriangle>& WorldGeometry, float AgentRadius)", "desc": "Из геометрии уровня строит упрощённый выпуклый полигональный граф проходимой поверхности — с учётом того, что у агента есть радиус (нельзя пройти в щель уже него)."}, {"sig": "TArray<FVector> FindPath(FVector Start, FVector End)", "desc": "Ищет путь на уже построенном NavMesh — не трогает исходную геометрию уровня, только граф полигонов."}, {"sig": "float Heuristic(FNavPoly A, FNavPoly B)", "desc": "Оценка «сколько ещё примерно осталось» — обычно просто расстояние по прямой между центрами полигонов, нужна A*, чтобы искать в сторону цели, а не во все стороны сразу."}], "blocks": [{"type": "h", "text": "Построение NavMesh (упрощённо)"}, {"type": "p", "text": "Берётся вся геометрия уровня, отфильтровываются только те поверхности, что достаточно горизонтальны (можно стоять) и не слишком узкие для радиуса агента, из них строится связный полигональный граф «где можно ходить» — это на порядки проще, чем оригинальная геометрия (тысячи треугольников превращаются в десятки полигонов проходимости)."}, {"type": "h", "text": "A* поиск пути на этом графе"}, {"type": "code", "text": "float AStar(FNavPoly Start, FNavPoly Goal, TArray<FVector>& OutPath) {\n    PriorityQueue<FNavPoly> Open; // сортирована по F = G + H\n    Map<FNavPoly,float> GScore;   // реальная пройденная стоимость от старта\n    Open.Push(Start, 0);\n    GScore[Start] = 0;\n    while (!Open.Empty()) {\n        FNavPoly Cur = Open.PopLowestF();\n        if (Cur == Goal) return ReconstructPath(Cur);\n        for (FNavPoly Nb : Cur.Neighbors) {\n            float TentativeG = GScore[Cur] + Distance(Cur, Nb);\n            if (TentativeG < GScore.Get(Nb, INFINITY)) {\n                GScore[Nb] = TentativeG;\n                float F = TentativeG + Heuristic(Nb, Goal);\n                Open.Push(Nb, F);\n            }\n        }\n    }\n    return {}; // пути нет\n}"}, {"type": "p", "text": "A* — это Дейкстра, но с эвристикой H, которая «подталкивает» поиск в сторону цели вместо равномерного расширения во все стороны — поэтому находит путь быстрее на больших картах. После нахождения цепочки полигонов обычно делают ещё один проход («string pulling»/funnel algorithm), который спрямляет путь по центрам полигонов в реалистичную ломаную линию, а не зигзаг по центрам ячеек."}], "connects": "AIModule (узел Behavior Tree «MoveTo») зовёт FindPath(), получает список точек и покадрово двигает Actor Engine к следующей точке, аналогично тому, как это делает компонент движения из IrisCore/Engine.", "study": ["построение NavMesh из геометрии уровня (концепция Recast)", "A* pathfinding", "funnel algorithm для сглаживания пути"]}, "MassEntity": {"intro": "ECS (Entity-Component-System) в противовес обычной композиции объектов (см. Engine): вместо «у каждого объекта свой набор указателей на компоненты» — данные одного типа для всех объектов лежат подряд в памяти (structure-of-arrays), что на порядок быстрее для тысяч однотипных объектов. Разобранным считается, если у тебя 10000 «юнитов» двигаются в одном плотном цикле без единого обращения по указателю через кэш-промахи.", "api": [{"sig": "using FEntity = uint32", "desc": "Сущность — это просто число (индекс), у неё самой нет ни данных, ни методов."}, {"sig": "struct FPositionArray { TArray<FVector> Data; }", "desc": "Компонент — это массив данных одного типа для всех сущностей сразу, а не поле внутри объекта."}, {"sig": "struct FArchetype { TArray<FEntity> Entities; TMap<TypeId, void*> ComponentArrays; }", "desc": "Все сущности с одинаковым набором компонентов группируются в один archetype — их данные хранятся вместе одним плотным блоком."}, {"sig": "void ForEachChunk(TFunction<void(FPositionArray&, FVelocityArray&)> Fn)", "desc": "«Процессор» — функция, которая обрабатывает не одну сущность за раз, а сразу весь плотный массив (chunk) — это и даёт прирост скорости: CPU кэш загружает данные пачками."}], "blocks": [{"type": "h", "text": "Почему это быстрее обычных объектов"}, {"type": "p", "text": "В Engine у каждого Actor свои Component-объекты, разбросанные по куче — обход 10000 акторов означает 10000 непредсказуемых прыжков по памяти (cache miss на каждый). В ECS позиции всех сущностей лежат в одном непрерывном TArray<FVector> — CPU читает их пачками (cache line), обход становится линейным сканированием массива, которое современные процессоры выполняют в разы быстрее."}, {"type": "code", "text": "struct FPositionArray { TArray<FVector> Data; };\nstruct FVelocityArray { TArray<FVector> Data; };\n\nvoid MovementProcessor(FPositionArray& Pos, FVelocityArray& Vel, float dt) {\n    for (int i = 0; i < Pos.Data.Num(); i++)\n        Pos.Data[i] += Vel.Data[i] * dt;   // линейный проход по памяти, без единого указателя\n}"}, {"type": "p", "text": "«Archetype» нужен потому, что не у всех сущностей одинаковый набор компонентов (у одних есть Health, у других нет) — сущности группируют по точному набору компонентов, и Position-массив одного archetype лежит отдельно от Position-массива другого, но внутри каждой группы всё плотно и без дыр."}], "connects": "Живёт рядом с обычным Engine (Actor/Component), но не заменяет его целиком — обычно ECS используют для массовых простых сущностей (толпа, стаи), а сложные уникальные объекты (сам игрок, боссы) остаются обычными Actor.", "study": ["Data-Oriented Design / structure-of-arrays vs array-of-structures", "archetype-based ECS (как в Unity DOTS)"]}, "AnimGraphRuntime": {"intro": "Скелетная анимация — это интерполяция между позами костей и превращение их в матрицы, которыми двигают вершины меша. Разобранным считается, если у тебя меш плавно переходит из позы «стоять» в позу «бежать» и его вершины реально двигаются вслед за костями.", "api": [{"sig": "struct FBonePose { TArray<FTransform> LocalBoneTransforms; }", "desc": "Поза — это просто массив локальных трансформов (позиция+поворот+масштаб относительно родительской кости) для каждой кости скелета на один момент времени."}, {"sig": "FBonePose BlendPoses(const FBonePose& A, const FBonePose& B, float Alpha)", "desc": "Смешивает две позы: для позиции — линейная интерполяция (lerp), для поворота — сферическая (slerp, обычный lerp для кватернионов даёт неправильную скорость вращения)."}, {"sig": "TArray<FMatrix> ComputeSkinningMatrices(const FBonePose& Pose, const FSkeleton& Skeleton)", "desc": "Превращает локальные трансформы костей в финальные матрицы для GPU: мировой трансформ кости, умноженный на инверсию bind pose (позы, в которой меш был изначально сохранён)."}], "blocks": [{"type": "h", "text": "От позы к движению вершин"}, {"type": "p", "text": "У каждой вершины меша есть 1-4 кости-«влияния» с весами (skin weights) — вершина двигается как средневзвешенное движение этих костей. Но кость двигает вершину не сама по себе, а через разницу между её текущим положением и исходным (bind pose, поза в момент создания меша) — поэтому в формулу входит инверсия bind pose."}, {"type": "code", "text": "FTransform WorldBoneTransform(int BoneIdx, const FBonePose& Pose, const FSkeleton& Skel) {\n    if (Skel.ParentIndex[BoneIdx] == -1) return Pose.LocalBoneTransforms[BoneIdx];\n    return WorldBoneTransform(Skel.ParentIndex[BoneIdx], Pose, Skel) * Pose.LocalBoneTransforms[BoneIdx];\n}\n\nFMatrix SkinningMatrix(int BoneIdx, const FBonePose& Pose, const FSkeleton& Skel) {\n    return WorldBoneTransform(BoneIdx, Pose, Skel).ToMatrix() * Skel.InverseBindPose[BoneIdx];\n}\n\n// в вершинном шейдере на GPU:\n// FinalVertexPos = sum(Weight[i] * SkinningMatrix[BoneIndex[i]] * OriginalVertexPos) для i=0..3"}, {"type": "p", "text": "Blend по Alpha между позами Idle и Run на каждом кадре и есть та самая «анимационная машина состояний» — если Alpha плавно растёт от 0 до 1 за 0.2 секунды при начале бега, переход выглядит гладким, а не рывком."}], "connects": "Скелет (FSkeleton, иерархия костей) обычно приходит из ассета, импортированного через Interchange. Итоговые матрицы передаются в Renderer как данные для скиннинга в вершинном шейдере при отрисовке Skeletal Mesh Component из Engine.", "study": ["linear blend skinning", "почему для поворотов используют slerp, а не lerp", "bind pose и её инверсия"]}, "UMG": {"intro": "Визуальный редактор интерфейсов. Обёртка над Slate, позволяющая дизайнерам собирать UI мышкой и связывать логику через визуальные графы.", "api": [{"sig": "class UUserWidget", "desc": "Базовый класс для всех компонентов, созданных в редакторе."}], "blocks": [{"type": "p", "text": "UMG транслирует визуальные элементы в вызовы низкоуровневого Slate, обеспечивая удобство работы для художников интерфейсов."}], "connects": "Зависит от Slate и SlateCore. Генерирует виджеты во время игры.", "study": ["Визуальное программирование UI", "Паттерн MVVM"]}, "Kismet": {"intro": "Ядро визуального скриптинга. Превращает узлы графа в исполняемый байткод, работает поверх системы рефлексии.", "api": [{"sig": "class FKismetCompilerContext", "desc": "Контекст компиляции графа в байткод."}], "blocks": [{"type": "p", "text": "Позволяет создавать логику игры без программирования на C++, компилируя визуальные графы в инструкции виртуальной машины."}], "connects": "Использует Engine и CoreUObject для доступа к классам и методам.", "study": ["Виртуальные машины", "Компиляция визуальных графов"]}, "ChillEd": {"intro": "Основной модуль редактора движка. Управляет окнами, загрузкой ассетов, сборкой проекта и связывает все инструменты воедино.", "api": [{"sig": "class UEditorEngine", "desc": "Главный класс, управляющий состоянием редактора."}], "blocks": [{"type": "p", "text": "Это центральный хаб, объединяющий все остальные инструменты разработчика в единое приложение."}], "connects": "Связывает LevelEditor, Kismet и другие модули редактора.", "study": ["Архитектура редакторов", "Управление состоянием приложения"]}, "LevelEditor": {"intro": "Редактор уровней. Предоставляет вьюпорт 3D-сцены, панель деталей, аутлайнер и инструменты расстановки объектов.", "api": [{"sig": "class FLevelEditorModule", "desc": "Модуль, отвечающий за инициализацию интерфейса сборки уровней."}], "blocks": [{"type": "p", "text": "То, что видит левел-дизайнер: инструменты для расстановки света, геометрии и настройки параметров."}], "connects": "Встраивается в ChillEd, использует Slate для отрисовки интерфейса.", "study": ["Gizmo и манипуляторы", "Отрисовка вьюпорта в редакторе"]}, "Sockets": {"intro": "Абстракция над сетевыми сокетами операционной системы (TCP/UDP). Обеспечивает кроссплатформенную передачу байтов.", "api": [{"sig": "class FSocket", "desc": "Базовый класс сокета для отправки и получения данных."}], "blocks": [{"type": "p", "text": "Скрывает различия между реализациями сокетов в Windows, Linux и других ОС."}], "connects": "Используется модулем NetCore для пересылки пакетов.", "study": ["Сетевое программирование", "UDP/TCP протоколы"]}, "GPUBackend": {"intro": "Конкретная реализация графического API (Vulkan, DirectX). Переводит абстрактные команды RHI в вызовы драйвера видеокарты.", "api": [{"sig": "class FDynamicRHI", "desc": "Интерфейс, который реализует конкретный бэкенд."}], "blocks": [{"type": "p", "text": "Самый низкий уровень графики, напрямую общающийся с железом."}], "connects": "Выполняет команды, поступающие из RHI.", "study": ["Vulkan API", "DirectX 12"]}, "Projects": {"intro": "Система управления проектами и плагинами. Читает конфигурационные файлы и решает, какие модули загружать в память.", "api": [{"sig": "class IProjectManager", "desc": "Управляет списком загруженных плагинов и модулей."}], "blocks": [{"type": "p", "text": "Обеспечивает модульность движка, позволяя легко включать и выключать компоненты."}], "connects": "Используется ядром для инициализации архитектуры при запуске.", "study": ["Динамическая загрузка библиотек", "Модульная архитектура"]}, "AudioMixer": {"intro": "Программный аудиодвижок. Смешивает звуковые потоки, применяет эффекты (реверберация, эквалайзер) и передаёт финальный буфер на звуковую карту.", "api": [{"sig": "class FAudioMixer", "desc": "Главный микшер, обрабатывающий все активные звуки."}], "blocks": [{"type": "p", "text": "Обрабатывает пространственный звук и DSP-эффекты на CPU перед отправкой на железо."}], "connects": "Связан с Engine для получения позиций источников звука.", "study": ["Цифровая обработка сигналов", "Пространственное аудио"]}, "ApplicationCore": {"intro": "Абстракция платформы и окна приложения. Обрабатывает события мыши, клавиатуры, изменение размера окна и взаимодействие с ОС.", "api": [{"sig": "class FGenericApplication", "desc": "Базовый класс для системного окна."}], "blocks": [{"type": "p", "text": "Изолирует движок от специфичного для ОС кода (Win32, X11)."}], "connects": "Передает события ввода в InputCore.", "study": ["Цикл сообщений ОС", "Оконные системы"]}, "SlateCore": {"intro": "Низкоуровневое ядро UI-фреймворка. Содержит базовые типы, математику для интерфейсов и механизмы отрисовки (кисти, шрифты).", "api": [{"sig": "struct FGeometry", "desc": "Описывает позицию, размер и трансформацию виджета."}], "blocks": [{"type": "p", "text": "Предоставляет фундамент для построения виджетов в Slate."}], "connects": "Является основой для модуля Slate.", "study": ["Математика 2D трансформаций", "Рендеринг текста"]}};
</script>
<script>
(function(){
const LAYERS = PAYLOAD.layers;
const MODULES = PAYLOAD.modules;
const ROLE = PAYLOAD.role;
const FILES = PAYLOAD.files;
const PATHS = PAYLOAD.path;
const DIM_EDGES = PAYLOAD.dim_edges;
const BOLD_EDGES = PAYLOAD.bold_edges;
const HOOKS = PAYLOAD.hooks;

// current on/off state
const state = {};
Object.keys(MODULES).forEach(id => {
  const m = MODULES[id];
  state[id] = m.required ? true : (m.default !== undefined ? m.default : false);
});
const gpuChoice = {current: 'VulkanRHI'}; // cosmetic only, both real modules exist in archive

const hooksByModule = {};
HOOKS.forEach(h => { (hooksByModule[h.on] = hooksByModule[h.on] || []).push(h); });

// dependency map for cascade logic (bold edges only — dim "->Core" is implicit/always fine)
const dependsOn = {};   // id -> [ids it needs]
const neededBy = {};    // id -> [ids that need it]
Object.keys(MODULES).forEach(id => { dependsOn[id]=[]; neededBy[id]=[]; });
BOLD_EDGES.forEach(e => { dependsOn[e.from].push(e.to); neededBy[e.to].push(e.from); });

// ---------- render columns ----------
const grid = document.getElementById('grid');
const order = [...LAYERS].sort((a,b)=>a.x-b.x);
order.forEach(L => {
  const col = document.createElement('div'); col.className='col';
  col.innerHTML = `<div class="col-head" style="border-color:${L.color};color:${L.color}">${L.label}</div>
                    <div class="col-note">${L.note}</div>
                    <div class="col-body" id="col-${L.id}"></div>`;
  grid.appendChild(col);
});
Object.keys(MODULES).forEach(id => {
  const m = MODULES[id];
  const body = document.getElementById('col-'+m.layer);
  const card = document.createElement('div');
  card.className = 'card'; card.id = 'card-'+id;
  card.dataset.id = id;
  let badges = '';
  if (m.required) badges += `<span class="badge req">обяз.</span>`;
  if (DEEPDIVE[id] || (m.choice && m.choice.some(c=>DEEPDIVE[c]))) badges += `<span class="badge dd">разбор</span>`;
  if (hooksByModule[id]) badges += `<span class="badge hook" title="${hooksByModule[id].map(h=>h.replaces+' → '+h.via).join(' | ')}">🔌 ${hooksByModule[id].length}</span>`;
  let inner = `<div class="name">${m.label}</div><div class="badges">${badges}</div>`;
  if (m.choice) {
    inner += `<div class="choice-row">` + m.choice.map((c,i)=>`<div class="choice-btn ${c===gpuChoice.current?'sel':''}" data-choice="${c}">${m.choice_label[i]}</div>`).join('') + `</div>`;
  }
  card.innerHTML = inner;
  if (!m.required) {
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = state[id];
    cb.addEventListener('click', (e)=>{ e.stopPropagation(); toggleModule(id, cb.checked); });
    card.appendChild(cb);
  }
  card.addEventListener('mouseenter', (e)=>showTooltip(e,id));
  card.addEventListener('mousemove', moveTooltip);
  card.addEventListener('mouseleave', hideTooltip);
  // card.addEventListener('contextmenu', (e)=>{ e.preventDefault(); openDeepDive(id); });
  if (m.choice) {
    card.querySelectorAll('.choice-btn').forEach(b => b.addEventListener('click', (e)=>{
      e.stopPropagation(); gpuChoice.current = b.getAttribute('data-choice');
      card.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      log(`Выбран GPU-бэкенд: ${b.textContent}`);
    }));
  }
  body.appendChild(card);
});

// ---------- cascade logic ----------
function toggleModule(id, on, silent){
  if (MODULES[id].required) return;
  state[id] = on;
  const changed = [];
  if (on){
    // auto-enable everything it depends on
    const stack=[id];
    while(stack.length){
      const cur=stack.pop();
      dependsOn[cur].forEach(dep=>{
        if(!MODULES[dep].required && !state[dep]){ state[dep]=true; changed.push(dep); stack.push(dep); }
      });
    }
  } else {
    // auto-disable everything that needed it
    const stack=[id];
    while(stack.length){
      const cur=stack.pop();
      neededBy[cur].forEach(dep=>{
        if(!MODULES[dep].required && state[dep]){ state[dep]=false; changed.push(dep); stack.push(dep); }
      });
    }
  }
  if (!silent){
    if (changed.length) log(`${on?'Включили':'Выключили'} ${id} → автоматически ${on?'включились':'выключились'}: ${changed.join(', ')}`, true);
    else log(`${on?'Включили':'Выключили'} ${id}`);
  }
  renderState();
}
function renderState(){
  Object.keys(MODULES).forEach(id => {
    const card = document.getElementById('card-'+id);
    card.classList.toggle('off', !state[id]);
    const cb = card.querySelector('input[type=checkbox]');
    if (cb) cb.checked = state[id];
  });
  drawEdges();
  updateSummary();
}

// ---------- presets ----------
document.getElementById('preset-game').addEventListener('click', ()=>{
  Object.keys(MODULES).forEach(id=>{ if(!MODULES[id].required) state[id] = MODULES[id].layer!=='Editor' && MODULES[id].default!==false; });
  log('Пресет: 🎮 Игрок — Editor выключен целиком', true);
  renderState();
});
document.getElementById('preset-editor').addEventListener('click', ()=>{
  Object.keys(MODULES).forEach(id=>{ if(!MODULES[id].required) state[id] = true; });
  log('Пресет: 🛠 Редактор — включено всё', true);
  renderState();
});

// ---------- summary ----------
function updateSummary(){
  const on = Object.keys(MODULES).filter(id=>state[id]);
  const totalFiles = on.reduce((s,id)=>s+(FILES[id]||0),0);
  const byLayer = {};
  on.forEach(id=>{ const L=MODULES[id].layer; byLayer[L]=(byLayer[L]||0)+1; });
  let html = `<div class="row"><span>Модулей включено</span><span class="v">${on.length} / ${Object.keys(MODULES).length}</span></div>`;
  html += `<div class="row"><span>Реальных файлов (.h/.cpp)</span><span class="v">${totalFiles.toLocaleString('ru-RU')}</span></div>`;
  html += `<div class="row"><span>Editor включён?</span><span class="v">${on.some(id=>MODULES[id].layer==='Editor')?'да':'нет — чистый Runtime'}</span></div>`;
  html += `<div class="bylayer">` + order.map(L=>`${L.label}: ${byLayer[L.id]||0}`).join(' · ') + `</div>`;
  document.getElementById('summary').innerHTML = html;
}

// ---------- log ----------
function log(text, cascade){
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cascade) line.className='cascade';
  line.textContent = '› ' + text;
  el.insertBefore(line, el.firstChild);
}

// ---------- edges (SVG overlay, computed from real DOM positions) ----------
const scrollEl = document.getElementById('diagram-scroll');
function drawEdges(){
  let svg = document.getElementById('edges');
  if (svg) svg.remove();
  const gridEl = document.getElementById('grid');
  const gridRect = gridEl.getBoundingClientRect();
  svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='edges';
  svg.setAttribute('width', gridEl.scrollWidth);
  svg.setAttribute('height', gridEl.scrollHeight);
  svg.innerHTML = `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#5b8fb0"/></marker></defs>`;
  gridEl.style.position='relative';
  gridEl.prepend(svg);

  function center(id){
    const el = document.getElementById('card-'+id);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return {x: r.left - gridRect.left, y: r.top - gridRect.top + r.height/2, w: r.width, h: r.height};
  }
  function path(a,b,cls){
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    const isForward = b.x >= a.x;
    const x1 = isForward ? a.x+a.w : a.x;
    const x2 = isForward ? b.x : b.x+b.w;
    const midx = (x1+x2)/2;
    p.setAttribute('d', `M${x1},${a.y} C${midx},${a.y} ${midx},${b.y} ${x2},${b.y}`);
    p.setAttribute('class', cls);
    return p;
  }
  DIM_EDGES.forEach(e=>{
    const a=center(e.from), b=center(e.to); if(!a||!b) return;
    const p = path(a,b,'edge-dim' + ((!state[e.from]||!state[e.to])?' edge-off':''));
    svg.appendChild(p);
  });
  BOLD_EDGES.forEach(e=>{
    const a=center(e.from), b=center(e.to); if(!a||!b) return;
    const p = path(a,b,'edge-bold' + ((!state[e.from]||!state[e.to])?' edge-off':''));
    svg.appendChild(p);
  });
}
window.addEventListener('resize', drawEdges);

// ---------- tooltip ----------
const tooltip = document.getElementById('tooltip');
function showTooltip(e, id){
  const m = MODULES[id];
  let html = `<div class="tt-title">${m.label}${m.required?' <span style="color:var(--req)">(обязателен)</span>':''}</div>`;
  html += `<div class="tt-role">${ROLE[id]||''}</div>`;
  html += `<div class="tt-stats">Слой: ${LAYERS.find(l=>l.id===m.layer).label}<br>Путь: ${PATHS[id]||''}<br>Файлов: ${FILES[id]||'—'}</div>`;
  
  html += `<div class="tt-hint">клик по чекбоксу — включить/выключить</div>`;
  tooltip.innerHTML = html; tooltip.style.opacity=1; moveTooltip(e);
}
function moveTooltip(e){
  let x=e.clientX+16, y=e.clientY+16;
  if (x+330>window.innerWidth) x=e.clientX-330-16;
  tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
}
function hideTooltip(){ tooltip.style.opacity=0; }

// ---------- deep dive (reuse) ----------
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function genericDeepDiveHtml(id){
  let html = `<div class="dd-p">${ROLE[id]||''}</div>`;
  html += `<div class="dd-generic-note">
    Он входит в слой «${LAYERS.find(l=>l.id===MODULES[id].layer).label}», путь в архиве: ${PATHS[id]||''}.</div>`;
  return html;
}
function curatedDeepDiveHtml(d){
  let html = `<div id="dd-intro">${d.intro}</div><div class="dd-section-title">Методы, которые нужно реализовать</div>`;
  d.api.forEach(a=> html += `<div class="dd-api-item"><div class="dd-api-sig">${escapeHtml(a.sig)}</div><div class="dd-api-desc">${a.desc}</div></div>`);
  html += `<div class="dd-section-title">Как это работает — по шагам</div>`;
  d.blocks.forEach(b=>{
    if(b.type==='h') html += `<div class="dd-h">${b.text}</div>`;
    else if(b.type==='code') html += `<div class="dd-code">${escapeHtml(b.text)}</div>`;
    else html += `<div class="dd-p">${b.text}</div>`;
  });
  html += `<div class="dd-section-title">Как это связано с другими модулями</div><div id="dd-connects">${d.connects}</div>`;
  return html;
}
function openDeepDive(id){
  const m = MODULES[id];
  document.getElementById('dd-title').textContent = m.label;
  const hasDD = DEEPDIVE[id];
  document.getElementById('dd-badges').innerHTML = `<span class="dd-badge">${LAYERS.find(l=>l.id===m.layer).label}</span>` +
    (hasDD ? `<span class="dd-badge" style="color:#ffd54f;border-color:#ffd54f66">подробный разбор</span>` : '');
  document.getElementById('dd-body').innerHTML = hasDD ? curatedDeepDiveHtml(DEEPDIVE[id]) : genericDeepDiveHtml(id);
  document.getElementById('dd-overlay').classList.add('open');
}
document.getElementById('dd-close').addEventListener('click', ()=>document.getElementById('dd-overlay').classList.remove('open'));
document.getElementById('dd-overlay').addEventListener('click', (e)=>{ if(e.target.id==='dd-overlay') e.currentTarget.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') document.getElementById('dd-overlay').classList.remove('open'); });

// ---------- init ----------
renderState();
log('Готово: выбрана сборка по умолчанию (Runtime без Editor). Меняйте чекбоксы или нажмите пресет.');
})();
</script>
